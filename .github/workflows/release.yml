name: FleetX Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.1)'
        required: true
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_CONTENT" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON GitHub Secret is missing!"
            exit 1
          fi
          python -c "import os; open('app/google-services.json', 'w', encoding='utf-8').write(os.environ['GOOGLE_SERVICES_JSON_CONTENT'])"
          echo "SUCCESS: Injected google-services.json from GitHub Secrets"

      - name: Decode FleetX Production Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "ERROR: Missing required release signing GitHub Secrets (RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD)."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/fleetx_release.jks"
          chmod 600 "${{ runner.temp }}/fleetx_release.jks"
          echo "SUCCESS: Decoded production keystore to temporary runner storage."

      - name: Build Production Release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/fleetx_release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleProdRelease --stacktrace

      - name: Verify Release APK Production Signature
        run: |
          APK_PATH=$(find app/build/outputs/apk/prod/release/ -name "*.apk" | head -n 1)
          echo "Checking APK at: $APK_PATH"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name "apksigner" | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK_PATH" > cert_info.txt
          cat cert_info.txt
          if grep -q "513e623733f4292ee4c52bf863dca642f83d8ea1f0fcf43a4e921a852fa3eb22" cert_info.txt; then
            echo "VERIFIED: APK is signed with FleetX Production key (513e62...)"
          else
            echo "FATAL: APK signing key mismatch! Aborting release."
            exit 1
          fi

      - name: Locate APK and Compute Checksum
        id: apk_info
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          fi
          
          # Find generated APK
          APK_PATH=$(find app/build/outputs/apk/prod/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found after build."
            exit 1
          fi
          
          RELEASE_APK="FleetX-${TAG_NAME}.apk"
          cp "$APK_PATH" "$RELEASE_APK"
          
          SHA256=$(sha256sum "$RELEASE_APK" | awk '{print $1}')
          FILE_SIZE=$(stat -c%s "$RELEASE_APK")
          
          # Extract versionCode and versionName from build.gradle.kts or tag
          VERSION_NAME=$(echo "$TAG_NAME" | sed 's/^v//')
          
          # Compute semver integer code e.g. 1.0.1 -> 10001
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "apk_path=$RELEASE_APK" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
          
          # Create checksums.txt
          echo "$SHA256  $RELEASE_APK" > checksums.txt

      - name: Generate Dynamic Release Notes and Manifest
        env:
          TAG_NAME: ${{ steps.apk_info.outputs.tag_name }}
          APK_NAME: ${{ steps.apk_info.outputs.apk_path }}
          SHA256: ${{ steps.apk_info.outputs.sha256 }}
          VERSION_CODE: ${{ steps.apk_info.outputs.version_code }}
          FILE_SIZE: ${{ steps.apk_info.outputs.file_size }}
          RELEASES_REPO: bkeshava636-dot/FleetX
        run: |
          python3 .github/scripts/generate_release_notes.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk_info.outputs.tag_name }}
          name: FleetX ${{ steps.apk_info.outputs.tag_name }}
          draft: false
          prerelease: false
          make_latest: true
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            ${{ steps.apk_info.outputs.apk_path }}
            update-manifest.json
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json on main branch
        env:
          TAG_NAME: ${{ steps.apk_info.outputs.tag_name }}
        run: |
          cp release-version.json "${{ runner.temp }}/version.json"
          git fetch origin main
          git checkout -B main origin/main
          cp "${{ runner.temp }}/version.json" version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update version.json for ${TAG_NAME} [skip ci]"
            git push origin main
          fi

      - name: Clean Up Temporary Signing Files
        if: always()
        run: |
          rm -f "${{ runner.temp }}/fleetx_release.jks" cert_info.txt
