name: FleetX Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.1)'
        required: true
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_CONTENT" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON GitHub Secret is missing!"
            exit 1
          fi
          python -c "import os; open('app/google-services.json', 'w', encoding='utf-8').write(os.environ['GOOGLE_SERVICES_JSON_CONTENT'])"
          echo "SUCCESS: Injected google-services.json from GitHub Secrets"

      - name: Verify FleetX Production Keystore Presence
        run: |
          if [ -f "app/keystore/fleetx_release.jks" ]; then
            echo "SUCCESS: FleetX production keystore is present at app/keystore/fleetx_release.jks"
          else
            echo "ERROR: app/keystore/fleetx_release.jks missing!"
            exit 1
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify Release APK Production Signature
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Checking APK at: $APK_PATH"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name "apksigner" | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK_PATH" > cert_info.txt
          cat cert_info.txt
          if grep -q "513e623733f4292ee4c52bf863dca642f83d8ea1f0fcf43a4e921a852fa3eb22" cert_info.txt; then
            echo "VERIFIED: APK is signed with FleetX Production key (513e62...)"
          else
            echo "FATAL: APK signing key mismatch! Aborting release."
            exit 1
          fi

      - name: Locate APK and Compute Checksum
        id: apk_info
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          fi
          
          # Find generated APK
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found after build."
            exit 1
          fi
          
          RELEASE_APK="FleetX-${TAG_NAME}.apk"
          cp "$APK_PATH" "$RELEASE_APK"
          
          SHA256=$(sha256sum "$RELEASE_APK" | awk '{print $1}')
          FILE_SIZE=$(stat -c%s "$RELEASE_APK")
          
          # Extract versionCode and versionName from build.gradle.kts or tag
          VERSION_NAME=$(echo "$TAG_NAME" | sed 's/^v//')
          
          # Compute semver integer code e.g. 1.0.1 -> 10001
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "apk_path=$RELEASE_APK" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
          
          # Extract release notes from version.json if available
          if [ -f "version.json" ]; then
            RELEASE_NOTES=$(python3 -c "import json; data=json.load(open('version.json')); print(data.get('releaseNotes', ''))" 2>/dev/null || echo "")
          else
            RELEASE_NOTES=""
          fi

          # Extract git commit changelog since previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            GIT_LOG=$(git log "${PREV_TAG}..HEAD" --oneline --no-merges)
          else
            GIT_LOG=$(git log -n 10 --oneline --no-merges)
          fi

          # Create dynamic release notes file
          cat <<EOF > release-notes.md
## FleetX Campus Transit Portal - Release $TAG_NAME

### What's New in this Release
${RELEASE_NOTES:-"FleetX continuous reliability, telemetry, and background tracking stability update."}

### Recent Commits ($TAG_NAME)
\`\`\`text
$GIT_LOG
\`\`\`

### Release Information
- **Version Name:** \`$VERSION_NAME\`
- **Version Code:** \`$VERSION_CODE\`
- **Release Date:** $(date -u +'%Y-%m-%d %H:%M UTC')
- **APK Asset:** \`$RELEASE_APK\`
- **SHA-256 Checksum:**
\`\`\`
$SHA256
\`\`\`

versionCode: $VERSION_CODE
SHA-256: $SHA256
EOF

          # Create companion update manifest
          cat <<EOF > update-manifest.json
          {
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "sha256": "$SHA256",
            "sizeBytes": $FILE_SIZE,
            "apkFileName": "$RELEASE_APK",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          
          # Create checksums.txt
          echo "$SHA256  $RELEASE_APK" > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk_info.outputs.tag_name }}
          name: FleetX ${{ steps.apk_info.outputs.tag_name }}
          draft: false
          prerelease: false
          make_latest: true
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            ${{ steps.apk_info.outputs.apk_path }}
            update-manifest.json
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
